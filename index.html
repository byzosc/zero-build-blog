<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>zosc blog</title>
  <meta name="description" content="zosc 的博客 · 自托管 / AI / 折腾。">
  <link rel="canonical" href="https://blog.zosc.com/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="zosc blog">
  <meta property="og:title" content="zosc blog">
  <meta property="og:description" content="zosc 的博客 · 自托管 / AI / 折腾。">
  <meta property="og:url" content="https://blog.zosc.com/">
  <meta property="og:image" content="https://zosc.com/media/images/common/brand/og-default.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="author" href="https://zosc.com/">
  <!-- Same author entity as zosc.com (@id https://zosc.com/#person): ties this blog to zosc in Google. -->
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"Blog","@id":"https://blog.zosc.com/#blog","name":"zosc blog","url":"https://blog.zosc.com/","inLanguage":["zh-CN","en"],"author":{"@type":"Person","@id":"https://zosc.com/#person","name":"zosc","url":"https://zosc.com/","sameAs":["https://github.com/byzosc","https://x.com/byzosc","https://www.behance.net/zosc","https://steamcommunity.com/id/byzosc"]},"publisher":{"@type":"Organization","@id":"https://zosc.com/#organization","name":"zosc","url":"https://zosc.com/"}}</script>
  <script>
    (() => {
      try {
        const theme = localStorage.getItem('theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    })();
  </script>
  <link rel="icon" href="assets/brand/zosc-mark-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/brand/zosc-mark-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="assets/brand/zosc-mark-180.png">
  <link id="hljs-light" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/styles/github.min.css" media="(prefers-color-scheme: light)">
  <link id="hljs-dark" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#/" aria-label="zosc blog home">
      <img class="brand-mark" src="assets/brand/zosc-mark-32.png" alt="" width="24" height="24">
      <span>zosc&nbsp;blog</span>
    </a>
    <nav class="site-nav">
      <a href="https://zosc.com/" rel="author">zosc.com</a>
      <a href="https://github.com/byzosc/zero-build-blog" target="_blank" rel="noopener">GitHub</a>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle theme">Dark</button>
    </nav>
  </header>

  <main id="app"><p class="state">Loading…</p></main>

  <footer class="site-footer">
    © <span id="year"></span> <a href="https://zosc.com/" rel="author">zosc</a> · <span id="tagline">Plain Markdown · no build · push to publish.</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/highlight.min.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
