<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zerb's Blog</title>
  <meta name="description" content="Zerb 的博客 · 自托管 / AI / 折腾。">
  <script>
    (() => {
      try {
        const theme = localStorage.getItem('theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    })();
  </script>
  <link rel="icon" href="assets/brand/zerb-favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/brand/zerb-favicon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="assets/brand/zerb-favicon-180.png">
  <link id="hljs-light" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/styles/github.min.css" media="(prefers-color-scheme: light)">
  <link id="hljs-dark" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#/" aria-label="Zerb's Blog home">
      <img class="brand-mark" src="assets/brand/zerb-favicon-32.png" alt="" width="24" height="24">
      <span>Zerb's&nbsp;Blog</span>
    </a>
    <nav class="site-nav">
      <a href="https://github.com/byzosc/zero-build-blog" target="_blank" rel="noopener">GitHub</a>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle theme">Dark</button>
    </nav>
  </header>

  <main id="app"><p class="state">Loading…</p></main>

  <footer class="site-footer">
    © <span id="year"></span> Zerb · <span id="tagline">Plain Markdown · no build · push to publish.</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/highlight.min.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
