name: Build posts.json

on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'scripts/**'
      - 'index.html'
      - 'assets/**'
      - '.github/workflows/build-posts.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-posts
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate posts.json
        run: node scripts/gen-posts.mjs

      - name: Pre-render static pages, sitemap and feed
        run: |
          npm install --no-save marked@18.2.1
          node scripts/gen-static.mjs

      - name: Commit if changed
        run: |
          FILES="posts.json index.html sitemap.xml feed.xml :(glob)posts/**/index.html"
          if [ -n "$(git status --porcelain -- $FILES)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A -- $FILES
            git commit -m "chore: rebuild posts.json and static pages"
            git push
          else
            echo "生成物无变化，跳过提交"
          fi
