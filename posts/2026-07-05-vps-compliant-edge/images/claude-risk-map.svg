<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Claude 使用风险画像与合规做法</title>
  <desc id="desc">把容易触发误伤的账号行为，映射到更稳的 VPS 边缘控制面做法。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#172033"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#5eead4"/>
    </marker>
    <style>
      .title { fill:#f8fafc; font:700 34px "Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif; }
      .sub { fill:#bfd3e8; font:18px "Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif; }
      .card { fill:rgba(15,23,42,.88); stroke:#64748b; stroke-width:1.3; rx:18; }
      .good { fill:rgba(20,83,45,.38); stroke:#34d399; stroke-width:1.5; rx:18; }
      .bad { fill:rgba(127,29,29,.34); stroke:#fb7185; stroke-width:1.5; rx:18; }
      .h { fill:#f8fafc; font:700 22px "Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif; }
      .p { fill:#dbeafe; font:17px "Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif; }
      .small { fill:#cbd5e1; font:15px "Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif; }
      .line { stroke:#5eead4; stroke-width:2.4; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1120" cy="90" r="180" fill="#0e7490" opacity=".12"/>
  <circle cx="160" cy="660" r="240" fill="#f59e0b" opacity=".08"/>
  <text x="64" y="72" class="title">Claude 稳定使用：别做“像异常账号”的事</text>
  <text x="64" y="106" class="sub">VPS 的价值不是绕风控，而是把网络出口、授权、部署和监控做成可解释的稳定边界。</text>

  <rect x="70" y="160" width="330" height="430" class="bad"/>
  <text x="110" y="205" class="h">容易被误伤的画像</text>
  <text x="110" y="252" class="p">• 网络出口频繁漂移</text>
  <text x="110" y="292" class="p">• 多台机器共享同一私钥</text>
  <text x="110" y="332" class="p">• 自动化脚本没有边界</text>
  <text x="110" y="372" class="p">• 生产机临场修、无回滚</text>
  <text x="110" y="412" class="p">• 管理面板裸露公网</text>
  <text x="110" y="452" class="p">• 无日志、无健康检查</text>
  <text x="110" y="512" class="small">结果：账号行为难解释，故障也难恢复。</text>

  <path d="M420 375 H500" class="line"/>
  <rect x="515" y="210" width="250" height="330" class="card"/>
  <text x="570" y="254" class="h">VPS Edge</text>
  <text x="555" y="302" class="p">稳定出口</text>
  <text x="555" y="342" class="p">私网管理</text>
  <text x="555" y="382" class="p">独立公钥</text>
  <text x="555" y="422" class="p">部署 runbook</text>
  <text x="555" y="462" class="p">监控与备份</text>

  <path d="M785 375 H865" class="line"/>
  <rect x="880" y="160" width="330" height="430" class="good"/>
  <text x="920" y="205" class="h">更稳的合规画像</text>
  <text x="920" y="252" class="p">• 出口相对稳定且可解释</text>
  <text x="920" y="292" class="p">• 每台设备独立授权</text>
  <text x="920" y="332" class="p">• 自动化只做人审允许的事</text>
  <text x="920" y="372" class="p">• 失败可回滚，不即兴修</text>
  <text x="920" y="412" class="p">• 公网入口最小化</text>
  <text x="920" y="452" class="p">• 健康检查和日志可追踪</text>
  <text x="920" y="512" class="small">目标：减少误伤概率，不承诺“永不封”。</text>

  <rect x="310" y="628" width="660" height="42" rx="21" fill="rgba(251,191,36,.13)" stroke="#fbbf24"/>
  <text x="375" y="655" class="small">公开文章可以讲“降低误伤风险”，不要写“绕过风控教程”。</text>
</svg>
