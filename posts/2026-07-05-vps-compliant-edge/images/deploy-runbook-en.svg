<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">VPS deployment runbook</title>
  <desc id="desc">The update flow from aligned main branch to verification on a VPS.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#93c5fd"/>
    </marker>
    <style>
      .title { fill: #f8fafc; font: 700 34px Arial, sans-serif; }
      .sub { fill: #bfd3e8; font: 18px Arial, sans-serif; }
      .card { fill: rgba(15,23,42,0.88); stroke: #60a5fa; stroke-width: 1.4; rx: 18; }
      .num { fill: #0f172a; font: 800 18px Arial, sans-serif; }
      .h { fill: #f8fafc; font: 700 20px Arial, sans-serif; }
      .p { fill: #cbd5e1; font: 15px Arial, sans-serif; }
      .line { stroke: #93c5fd; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .warn { fill: #fef3c7; font: 16px Arial, sans-serif; }
    </style>
  </defs>
  <rect width="1280" height="560" fill="url(#bg)"/>
  <text x="64" y="70" class="title">A Backend-Only VPS Deployment</text>
  <text x="64" y="105" class="sub">The point is not copying files. It is backup, boundaries, and verification at every step.</text>

  <g transform="translate(62 158)">
    <rect width="142" height="160" class="card"/>
    <circle cx="32" cy="34" r="18" fill="#93c5fd"/><text x="27" y="40" class="num">1</text>
    <text x="24" y="78" class="h">Align main</text>
    <text x="24" y="112" class="p">Confirm GitHub main</text>
    <text x="24" y="136" class="p">points to the target</text>
  </g>
  <path d="M212 238 H272" class="line"/>
  <g transform="translate(284 158)">
    <rect width="142" height="160" class="card"/>
    <circle cx="32" cy="34" r="18" fill="#93c5fd"/><text x="27" y="40" class="num">2</text>
    <text x="24" y="78" class="h">Archive API</text>
    <text x="24" y="112" class="p">Package backend only</text>
    <text x="24" y="136" class="p">No frontend build</text>
  </g>
  <path d="M434 238 H494" class="line"/>
  <g transform="translate(506 158)">
    <rect width="142" height="160" class="card"/>
    <circle cx="32" cy="34" r="18" fill="#93c5fd"/><text x="27" y="40" class="num">3</text>
    <text x="24" y="78" class="h">Inventory</text>
    <text x="24" y="112" class="p">Containers, ports,</text>
    <text x="24" y="136" class="p">timers first</text>
  </g>
  <path d="M656 238 H716" class="line"/>
  <g transform="translate(728 158)">
    <rect width="142" height="160" class="card"/>
    <circle cx="32" cy="34" r="18" fill="#fbbf24"/><text x="27" y="40" class="num">4</text>
    <text x="24" y="78" class="h">Backup old</text>
    <text x="24" y="112" class="p">backend/app</text>
    <text x="24" y="136" class="p">timestamped copy</text>
  </g>
  <path d="M878 238 H938" class="line"/>
  <g transform="translate(950 158)">
    <rect width="142" height="160" class="card"/>
    <circle cx="32" cy="34" r="18" fill="#93c5fd"/><text x="27" y="40" class="num">5</text>
    <text x="24" y="78" class="h">Replace code</text>
    <text x="24" y="112" class="p">Extract in place</text>
    <text x="24" y="136" class="p">Leave other stacks</text>
  </g>
  <path d="M1021 318 C1021 380 196 380 196 408" class="line"/>
  <g transform="translate(128 392)">
    <rect width="200" height="110" class="card"/>
    <text x="26" y="44" class="h">Restart target</text>
    <text x="26" y="78" class="p">Only the changed service</text>
  </g>
  <path d="M338 447 H430" class="line"/>
  <g transform="translate(442 392)">
    <rect width="240" height="110" class="card"/>
    <text x="26" y="44" class="h">Verify endpoints</text>
    <text x="26" y="78" class="p">/health + new API + public edge</text>
  </g>
  <path d="M692 447 H784" class="line"/>
  <g transform="translate(796 392)">
    <rect width="250" height="110" class="card"/>
    <text x="26" y="44" class="h">Check neighbors</text>
    <text x="26" y="78" class="p">NAS bridge timer, tunnel, monitoring</text>
  </g>
  <rect x="365" y="520" width="550" height="28" rx="14" fill="rgba(251,191,36,0.13)" stroke="#fbbf24" stroke-width="1"/>
  <text x="438" y="540" class="warn">If it fails, roll back. Do not improvise on prod.</text>
</svg>
